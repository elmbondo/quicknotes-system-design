<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes API Client</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes API Client</h1>
      <p>Load, create and delete notes from a practice API.</p>
    </header>

    <main>
      <section>
        <h2>Notes from the server</h2>
        <button id="load-btn" type="button">Load notes</button>
        <p id="status" aria-live="polite"></p>
        <ul id="notes-list"></ul>
      </section>

      <section>
        <h2>Create a note</h2>
        <form id="note-form">
          <label for="title-input">Title</label>
          <input type="text" id="title-input" placeholder="Give your note a title">

          <label for="body-input">Body (optional)</label>
          <textarea id="body-input" rows="4" placeholder="Write the note here..."></textarea>

          <button type="submit" id="submit-btn">Add note</button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. Built during Web Foundations.</p>
    </footer>
  </body>
</html>
